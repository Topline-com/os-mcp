name: White-label check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-vendor-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for vendor-name leakage
        run: bash scripts/check-white-label.sh

      - name: Verify white-label guard behavior
        run: bash scripts/check-white-label.sh --self-test
