name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Deploy the edge worker first — it owns the LocationDO class that
      # the sync worker binds to via script_name in apps/sync/wrangler.toml.
      - name: Deploy edge worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/edge
          packageManager: npm

      - name: Deploy sync worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/sync
          packageManager: npm
